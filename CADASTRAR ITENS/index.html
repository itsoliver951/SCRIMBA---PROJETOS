<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de produtos</title>
    <link rel="stylesheet" href="style.css">

</head>
<body>

    <main id="container">

        <section class="box">
            <h1>Novo produto</h1>
            <p class="subtitle">Informe os dados do produto</p>

            <label for="nome">Nome do produto</label>
            <input type="text" id="nome" placeholder="Ex.: Papel sulfite A4">

            <label for="quantidade">Quantidade</label>
            <input type="number" id="quantidade" min="1" placeholder="Ex.: 10">
            <button id="bnt-el" onclick="adicionar()">Adicionar produto</button>
        </section>

        <section class="box">
            <h2>Produtos disponíveis</h2>
            <p id="nomeProduto" class="empty-message">Nenhum produto cadastrado</p>
            <div class="quantity-control">
                <button type="button" aria-label="Diminuir quantidade">−</button>
                <span id="quantidadeProduto">0</span>
                <button type="button" aria-label="Aumentar quantidade">+</button>
            </div>
        </section>

    </main>
    
    <script>
        let nome = document.getElementById("nome")
        let quantidade = document.getElementById("quantidade")

        function adicionar() {
            nome
        }

        

    </script>
</body>
</html>
